<!doctype html>
<!-- Gateway Console web UI — page shell: login form, sidebar with the user card and menu, header, the page container and footer.
     Scripts in js/ are loaded in order: core → charts → editor → pages (settings before setup) → app (starts the app). -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gateway Console</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237c6cff'/%3E%3Cpath d='M8 11h16M8 16h10M8 21h16' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="login" class="login hidden">
    <form id="loginForm" autocomplete="on">
      <div class="brand">GW<b>//</b>CONSOLE<small>HAProxy · Cloudflare Tunnel</small></div>
      <input name="user" type="text" placeholder="Username" autocomplete="username" required>
      <input name="password" type="password" placeholder="Password" autocomplete="current-password" required>
      <div class="err" id="loginErr"></div>
      <button class="btn pri" type="submit">Sign in</button>
    </form>
    <form id="codeForm" class="hidden" autocomplete="off">
      <div class="brand">GW<b>//</b>CONSOLE<small>Two-step sign-in</small></div>
      <div class="small muted" id="codeWho"></div>
      <input name="code" class="otp" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="••••••" maxlength="6">
      <input name="recovery" class="hidden" type="text" placeholder="Recovery code, e.g. ABCD-EFGH-JK" autocomplete="off" maxlength="14">
      <label class="small rem"><input type="checkbox" name="remember"> Remember this browser for 30 days</label>
      <div class="err" id="codeErr"></div>
      <button class="btn pri" type="submit">Verify</button>
      <div class="row small" style="justify-content:space-between"><a href="#" id="useRc">Use a recovery code</a><a href="#" id="codeBack" class="muted">Back</a></div>
    </form>
    <p class="lfoot" id="loginFoot"></p>
  </div>

  <div id="app" class="app hidden">
    <aside class="side" id="side">
      <div class="brand">GW<b>//</b>CONSOLE<small>Gateway control</small></div>
      <button class="hamb" id="hamb" type="button" aria-label="Pages">☰</button>
      <nav class="nav" id="nav">
        <a href="#/overview" data-p="overview">Overview</a>
        <a href="#/monitoring" data-p="monitoring">Monitoring</a>
        <a href="#/traffic" data-p="traffic">Traffic</a>
        <a href="#/tunnels" data-p="tunnels">CF Tunnels</a>
        <a href="#/haproxy" data-p="haproxy">HAProxy</a>
        <a href="#/alerts" data-p="alerts">Alerts <span class="count hidden" id="alertCount"></span></a>
        <a href="#/activity" data-p="activity">Activity</a>
        <a href="#/settings" data-p="settings" id="navSettings" class="hidden">Settings</a>
      </nav>
      <div class="ucard" id="ucard">
        <div class="umenu hidden" id="umenu">
          <div class="h"><b id="umName"></b><span id="umSub"></span></div>
          <a href="#/account"><i>◉</i>My account</a>
          <a href="#/account/prefs"><i>⚙</i>Preferences</a>
          <a href="#/account/sessions"><i>⧉</i>Signed-in browsers</a>
          <hr><a href="#" id="umNew"><i>✦</i>What's new</a><hr>
          <a href="#" id="logout" class="signout"><i>⎋</i>Sign out</a>
        </div>
        <button id="ubtn" type="button" aria-label="Your account"><span class="av" id="uav"></span><span class="who"><b id="who"></b><span class="rolepill" id="whoRole"></span></span><span class="chev">▾</span></button>
      </div>
    </aside>
    <main class="main">
      <header class="top">
        <div>
          <h1 id="title">Overview</h1>
          <div class="sub" id="subtitle"></div>
        </div>
        <div class="spacer"></div>
        <span class="sub" id="updated"></span>
        <span class="pulse" id="pulse" title="refresh status"></span>
        <label class="sub row" title="Auto refresh"><input type="checkbox" id="auto" checked> auto</label>
        <button class="btn sm" id="refresh">Refresh</button>
      </header>
      <div class="scopebar hidden" id="scopebar"></div>
      <section class="content" id="view"></section>
      <footer class="pfoot" id="pfoot"></footer>
    </main>
  </div>

  <div class="toasts" id="toasts"></div>
  <script>window.GWC_VERSION = "__GWC_VERSION__";</script>
  <script src="/static/js/core.js"></script>
  <script src="/static/js/charts.js"></script>
  <script src="/static/js/editor.js"></script>
  <script src="/static/js/overview.js"></script>
  <script src="/static/js/monitoring.js"></script>
  <script src="/static/js/traffic.js"></script>
  <script src="/static/js/tunnels.js"></script>
  <script src="/static/js/haproxy.js"></script>
  <script src="/static/js/hpform.js"></script>
  <script src="/static/js/alerts.js"></script>
  <script src="/static/js/activity.js"></script>
  <script src="/static/js/account.js"></script>
  <script src="/static/js/settings.js"></script>
  <script src="/static/js/setup.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
