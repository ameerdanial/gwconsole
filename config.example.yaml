# /etc/gwconsole/config.yaml — Gateway Console bootstrap settings
#
# From v1.2 this file only holds what the server needs before it starts.
# Users, nodes, Cloudflare accounts, notifications and general settings are
# managed in the web UI (Settings) and stored in the database.
# After editing: systemctl restart gwconsole

listen: 0.0.0.0          # bind address (keep it on your management VLAN / Tailscale)
port: 8088

ssh:
  key_file: /etc/gwconsole/id_ed25519        # created by install.sh
  known_hosts: /etc/gwconsole/known_hosts    # only for nodes without a pinned host key
  connect_timeout: 8

# Paths (defaults shown; you normally don't change these)
# db_path: /var/lib/gwconsole/gwconsole.db
# secret_key_file: /etc/gwconsole/secret.key
# audit_log: /var/lib/gwconsole/audit.log

# ---------------------------------------------------------------------------
# Upgrading from v1.1? Leave your old users:, haproxy_nodes:, cloudflared_nodes:
# and cloudflare: sections in place. On the first start of v1.2 they are imported
# into the database once (tokens from /etc/gwconsole/env included), and ignored
# after that. Rolling back to v1.1 keeps working because this file is untouched.
# ---------------------------------------------------------------------------
